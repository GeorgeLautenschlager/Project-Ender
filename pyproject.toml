[tool.poetry]
name = "project-ender"
version = "0.1.0"
description = "Knowledge distillation of LLM game decisions into trainable neural networks"
authors = ["George Lautenschlager"]
readme = "README.md"
packages = [{ include = "project_ender", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
torch = { version = ">=2.0", optional = true }
pydcs = { version = "*", optional = true }
mcp = { version = ">=1.0", optional = true }

[tool.poetry.extras]
training = ["torch"]
dcs = ["pydcs", "mcp"]

[tool.poetry.group.dev.dependencies]
black = "^24.0"
ruff = "^0.4"
mypy = "^1.10"
pytest = "^8.0"
pytest-cov = "^5.0"
pre-commit = "^3.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=project_ender", "--cov-report=term-missing"]
